name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AdminMonitoringTool/AdminMonitoringTool.Net.sln
      - name: Build
        run: dotnet build AdminMonitoringTool/AdminMonitoringTool.Net.sln --no-restore -c Release
      - name: Test
        run: dotnet test AdminMonitoringTool/AdminMonitoringTool.Net.sln --no-build -c Release
